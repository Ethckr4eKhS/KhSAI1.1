name: APK
on:
  workflow_dispatch:
  push:
    paths: ["android.zip", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Tayyorlash
        run: |
          unzip -q android.zip -d proj
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO,,}" = "$OWNER.github.io" ]; then URL="https://$OWNER.github.io/"; else URL="https://$OWNER.github.io/$REPO/"; fi
          echo "Sayt: $URL"
          printf '<resources><string name="site" translatable="false">%s</string></resources>\n' "$URL" > proj/app/src/main/res/values/site.xml
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
      - name: Yigish
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp proj/app/build/outputs/apk/debug/app-debug.apk 4eKhSAI.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "4eKhSAI APK ${{ github.run_number }}"
          files: 4eKhSAI.apk
